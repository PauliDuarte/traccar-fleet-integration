services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-delivery
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery123}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - delivery-postgres-data:/var/lib/postgresql/data
      - ./delivery-tracking/src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fleet-net
    restart: unless-stopped

  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: artemis-fleet
    environment:
      ANONYMOUS_LOGIN: "false"
      ARTEMIS_USER: ${ARTEMIS_USER:-admin}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-admin123}
    ports:
      - "${ARTEMIS_AMQP_HOST_PORT:-5672}:5672"   # AMQP 1.0 acceptor
      - "${ARTEMIS_CORE_HOST_PORT:-61617}:61616" # Core/OpenWire acceptor
      - "${ARTEMIS_MQTT_HOST_PORT:-1883}:1883" # MQTT acceptor
      - "${ARTEMIS_CONSOLE_HOST_PORT:-8162}:8161"   # Web console
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/var/lib/artemis-instance/bin/artemis check node --user $${ARTEMIS_USER} --password $${ARTEMIS_PASSWORD} --url tcp://localhost:61616",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net
    restart: unless-stopped

  traccar:
    image: traccar/traccar:latest
    container_name: traccar-fleet
    ports:
      - "8082:8082"   # Web UI / REST API
      - "5001:5001"   # gps103 protocol
      - "5002:5002"   # TK103 protocol
      - "5055:5055"   # OsmAnd protocol (used for GPS ping simulation)
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    #depends_on:
    #  artemis:
    #    condition: service_healthy
    environment:
      - CONFIG_USE_ENVIRONMENT_VARIABLES=true
      - DATABASE_USER
      - DATABASE_PASSWORD
    networks:
      - fleet-net
    restart: unless-stopped

  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
      additional_contexts:
        m2-cache: ${HOME}/.m2
    container_name: broker-fleet
    environment:
      ARTEMIS_AMQP_URL: ${ARTEMIS_AMQP_URL:-tcp://artemis:61616}
      ARTEMIS_USER: ${ARTEMIS_USER:-admin}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-admin123}
    ports:
      - "8080:8080"   # HTTP endpoint for Traccar forwards
    depends_on:
      artemis:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

  positions-consumer:
    build:
      context: .
      dockerfile: positions-consumer/Dockerfile
      additional_contexts:
        m2-cache: ${HOME}/.m2
    container_name: positions-consumer-fleet
    environment:
      ARTEMIS_AMQP_URL: ${ARTEMIS_AMQP_URL:-tcp://artemis:61616}
      ARTEMIS_USER: ${ARTEMIS_USER:-admin}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-admin123}
    depends_on:
      artemis:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

  events-consumer:
    build:
      context: .
      dockerfile: events-consumer/Dockerfile
      additional_contexts:
        m2-cache: ${HOME}/.m2
    container_name: events-consumer-fleet
    environment:
      ARTEMIS_AMQP_URL: ${ARTEMIS_AMQP_URL:-tcp://artemis:61616}
      ARTEMIS_USER: ${ARTEMIS_USER:-admin}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-admin123}
    depends_on:
      artemis:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

  delivery-tracking:
    build:
      context: .
      dockerfile: delivery-tracking/Dockerfile
      additional_contexts:
        m2-cache: ${HOME}/.m2
    container_name: delivery-tracking
    environment:
      ARTEMIS_AMQP_URL: ${ARTEMIS_AMQP_URL:-tcp://artemis:61616}
      ARTEMIS_USER: ${ARTEMIS_USER:-admin}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-admin123}
      DELIVERY_DB_URL: ${DELIVERY_DB_URL:-jdbc:postgresql://postgres:5432/delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery123}
    ports:
      - "${DELIVERY_HTTP_PORT:-8083}:8081"
    depends_on:
      artemis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

networks:
  fleet-net:
    driver: bridge

volumes:
  delivery-postgres-data:
